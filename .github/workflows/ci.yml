name: CI

on:
  push:
    # v30-dev is the repository's default branch and active development line
    # (see the "分支说明" section of README.md). It MUST be listed here: while
    # only main/master were listed, moving the default branch to v30-dev would
    # have silently switched CI off for every push.
    branches: [main, master, v30-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The engine itself is stdlib-only; pytest is the only dev dependency.
      - name: Install dev tooling
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: Verify zero runtime dependencies
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          bad = []
          for f in pathlib.Path("baize").rglob("*.py"):
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      mods = [(node.module or "").split(".")[0]] if node.level == 0 else []
                  else:
                      continue
                  for m in mods:
                      if m and m not in stdlib and m != "baize":
                          bad.append(f"{f}: {m}")
          if bad:
              print("Third-party imports found in runtime package:")
              print("\n".join(bad))
              sys.exit(1)
          print("OK: baize/ imports stdlib only")
          PY

      - name: Static grep gate (red line C — ext fail-closed)
        shell: bash
        run: |
          # Core baize/*.py must NEVER do a TOP-LEVEL `import baize.ext`.
          # Indented (function-body) imports are the sanctioned exception
          # (tools.register_mcp_client / cli.cmd_mcp). Anchor at column 0 so
          # indented imports are NOT flagged. We scan only top-level core
          # modules, never baize/ext/ itself.
          if grep -rnE '^(import|from) baize\.ext' baize/*.py; then
            echo "RED LINE C VIOLATION: top-level import baize.ext in core"
            exit 1
          fi
          echo "OK: no top-level import baize.ext in baize/*.py"

      - name: Doctor
        run: python -m baize doctor

      - name: Tests with coverage
        run: python -m pytest tests/ -q --cov=baize --cov-report=term-missing --cov-report=xml

      - name: Benchmarks
        run: python -m baize bench

      - name: Coverage threshold
        # The threshold lives in baize.config (TEST_COVERAGE_THRESHOLD) and is
        # enforced by scripts/coverage_gate.py - the same script `make cov` runs,
        # reading the same .coverage data file pytest-cov just wrote. CI used to
        # hardcode its own 80 here, so the documented promise and the enforced
        # number had already drifted apart.
        run: python scripts/coverage_gate.py

  truth:
    name: version & test-count single source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: python -m pip install --upgrade pip pytest

      # Two numbers on the front page used to be hand-typed in half a dozen
      # files: that is how README.md advertised V36.0.0 Titan for a whole
      # release, and a 53/53 test badge against a 650-case suite.
      # baize/__init__.py now holds the only version literals; this gate fails
      # the build if any derived surface drifts from it.
      # The passed/failed split is deliberately NOT gated here - it depends on
      # python/docker being on PATH, which differs between runners.
      - name: Version + test-count truth gate
        run: python scripts/sync_truth.py --check

      # .gitignore never applies to already-tracked files, so junk survives in
      # the index long after the ignore rule is added. Gate the index itself.
      - name: Tracked-file hygiene gate
        run: python scripts/check_hygiene.py

  install-smoke:
    name: one-command install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap
        run: python install/bootstrap.py

      - name: CLI is usable after install
        run: |
          python -m baize --version
          python -m baize doctor
          python -m baize index build

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t baize:ci .
      - name: Smoke test the image
        run: |
          docker run --rm baize:ci --version
          docker run --rm baize:ci doctor
